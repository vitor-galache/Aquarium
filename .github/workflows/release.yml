name: Release

# Dispara ao enviar uma tag de versão (ex.: v0.1.0). Gera os instaladores de
# macOS (Apple Silicon e Intel) e Linux e os anexa a uma release em
# rascunho no GitHub — revisar o changelog e publicar manualmente.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            bundle: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            stable: Notesea-macos-arm64.dmg
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            bundle: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
            stable: Notesea-macos-intel.dmg
          - platform: ubuntu-22.04
            args: ""
            bundle: src-tauri/target/release/bundle/appimage/*.AppImage
            stable: Notesea-linux.AppImage
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Notesea v__VERSION__
          releaseBody: |
            **macOS:** `brew install --cask vitor-galache/tap/notesea`

            **Linux:** baixe o `.AppImage`, `.deb` ou `.rpm` em **Assets**.
